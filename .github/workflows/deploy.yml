# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      # npm install ではなく npm ci。
      # package-lock.json のとおりに入れるので、ロックファイル外のバージョンが
      # 勝手に入りこむことがない(配るものを毎回同じにする)
      - name: Install dependencies
        run: npm ci
      # 配信されるライブラリ(本番依存)に既知の脆弱性がないことを確かめる。
      # ビルド用ツール(devDependencies)は児童の端末に配られないので --omit=dev で外す。
      # ここで止まったら、直すまでデプロイしない
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # 学習ログと、へやの入室まわり(だれを入れるか・何を配るか)のテスト
      - name: Test
        run: npm test
      # 書きまちがい(使っていない変数・useEffect の依存もれ)を止める。
      # 設定ファイルが無いまま lint スクリプトだけがあり、ずっと動いていなかった
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # GIGA Standard v4 の品質ゲート。
      # LICENSE・CSP・PWA一式・画像の大きさ・1ファイルの行数・初回JSの大きさなどを
      # 毎回たしかめる。dist の大きさを測るので build のあとに置く。
      # 落ちたら検査をゆるめず、quality.config.json に理由を書いて明示的に許可すること
      - name: Quality gate
        run: npm run check
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
