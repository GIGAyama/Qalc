<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      インストールの合図(beforeinstallprompt)を、いちばん先に受け取る。
      Chrome は条件がそろうと即座にこのイベントを出すため、React や CSS の
      読みこみより後だと取りこぼし、通信が遅い端末で「インストール」ボタンが出なくなる。
      中身と、インラインにしていない理由は public/pwa-install.js に書いてある。
    -->
    <script src="/pwa-install.js"></script>
    <!--
      Content Security Policy
      GitHub Pages は HTTP レスポンスヘッダを設定できないため meta で指定する。
      この方式では frame-ancestors / report-uri / sandbox は効かないので、変更したときは
      全画面を手で踏んでコンソールに違反が出ないことを確かめること。

      各指定の理由:
        script-src 'self'          … CDNからの動的読み込みをやめ、すべて同梱した
        style-src  'unsafe-inline' … テーマ切り替えが動的<style>、framer-motionがstyle属性を書きかえるため必須
        font-src   'self'          … フォントも同梱したので外部は不要
        connect-src                … PeerJS のシグナリング(へやの番号のやりとり)だけを許可する
        object-src 'none' / base-uri / form-action … 使っていない機能をふさぐ

      WebRTC の ICE(STUN/TURN)は CSP では制御できない。
      stun:／turn: を connect-src に書いても、ブラウザは「不正なソース」として無視する
      （webrtc-src 相当のディレクティブは現在のブラウザに存在しない）。
      接続先そのものは src/roomAccess.js の PEER_OPTIONS に明示しており、
      校内フィルタで許可が必要なホストは README にまとめてある。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; worker-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; frame-src https://gamification.giga-school.com; base-uri 'self'; form-action 'none'" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Qalc | カルク ～目指せ、計算マスター～</title>
    <meta name="description" content="小学生向け計算ゲーム学習アプリ。みんなで楽しく算数を学ぼう！" />
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="GIGA school">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="Qalc | カルク ～目指せ、計算マスター～">
    <meta property="og:description" content="小学生向け計算ゲーム学習アプリ。みんなで楽しく算数を学ぼう！">
    <meta property="og:url" content="https://qalc.giga-school.com/">
    <meta property="og:image" content="https://giga-school.com/assets/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
    <meta name="twitter:card" content="summary_large_image">
    <!-- 本文フォントは自分のサイトから配る(src/main.jsx で読みこみ)。外部への通信はない -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FF6B6B" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Qalc" />
