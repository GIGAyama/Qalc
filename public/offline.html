<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FF6B6B" />
    <title>Qalc | インターネットにつながっていません</title>
    <!--
      この画面にも CSP を入れてある。
      以前は「もういちど ためす」をインラインの <script> で動かしていたため
      script-src 'self' にできず、quality.config.json で例外として許可していた。
      いまはボタンを <a href> にして JavaScript を1行も使っていないので、
      例外を外して本体と同じ強さで閉じられる。

      style-src に 'unsafe-inline' が残るのは、この画面の CSS を <style> で
      直書きしているため。圏外で外部ファイルが取れないことがあるので、
      1枚で完結させる必要がある（それがこの画面の存在意義でもある）。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!--
      圏外のときに出る画面。「壊れた」と思わせないことが目的なので、
      アプリと同じ配色・同じ言いまわしにしてある。

      ここだけ CSS を直書きしているのは、この画面が出る状況では
      外部ファイルが取れないことがあるため（1枚で完結させる）。
      フォントも同じ理由でシステムのものを使う。Zen Maru Gothic が
      キャッシュにあれば使われ、無ければ普通の丸ゴシックに落ちる。
    -->
    <style>
      :root {
        --bg: #fffbf0;
        --panel: #ffffff;
        --text: #3f3f46;
        --primary: #FF6B6B;
        --accent: #fde68a;
      }
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100vh;   /* 古い端末むけのフォールバック */
        min-height: 100dvh;  /* 実際に使われる値 */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px))
                 calc(24px + env(safe-area-inset-right, 0px))
                 calc(24px + env(safe-area-inset-bottom, 0px))
                 calc(24px + env(safe-area-inset-left, 0px));
        background: var(--bg);
        color: var(--text);
        font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Kosugi Maru', system-ui, sans-serif;
        line-height: 1.8;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--panel);
        border: 4px solid var(--text);
        border-radius: 24px;
        box-shadow: 6px 6px 0 var(--text);
        padding: 28px 22px;
        text-align: center;
      }
      .mark { font-size: clamp(48px, 14vw, 76px); line-height: 1; margin-bottom: 8px; }
      h1 { font-size: clamp(20px, 5vw, 26px); font-weight: 900; margin: 0 0 12px; }
      p { font-size: clamp(14px, 3.6vw, 16px); margin: 0 0 22px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        width: 100%;
        padding: 0 20px;
        font-size: clamp(16px, 4vw, 18px);
        font-weight: 900;
        font-family: inherit;
        /* --primary(#FF6B6B) の上に白を載せると 2.78 しかない。
           本体が --on-primary で使っている色にそろえる（6.80） */
        color: #111111;
        background: var(--primary);
        border: 3px solid var(--text);
        border-radius: 16px;
        box-shadow: 3px 3px 0 var(--text);
        cursor: pointer;
        touch-action: manipulation;
        text-decoration: none;   /* <a> なので下線を消す。見た目はボタンのまま */
      }
      .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--text); }
      .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
      .hint {
        margin-top: 18px;
        font-size: clamp(12px, 3.2vw, 13px);
        /* 0.65 だと 3.82 しかなかった。12〜13px なので基準は 4.5:1。
           「ホーム画面に置いておけば圏外でも使える」は、
           まさにいま困っている人に向けた案内なので、薄くしてはいけない（Part I §2-8） */
        opacity: 0.8;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
      @media (forced-colors: active) {
        .btn { border: 2px solid ButtonText; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">📡</div>
      <h1>いま インターネットに つながっていません</h1>
      <p>
        Wi-Fi が つながっているか たしかめてから、<br />
        下の ボタンを おしてね。
      </p>
      <!-- ボタンではなくリンクにしてある（Part I §3-4）。
           圏外で、しかもアプリ本体が手元に無いときに出る画面なので、
           JavaScript が動くことを当てにしない。
           href をアプリの入口に向けておけば、押すだけで読み込み直しになる。 -->
      <a class="btn" href="./">もういちど ためす</a>
      <p class="hint">
        ホームがめんに Qalc を おいてあると、<br />
        つながっていなくても あそべます。
      </p>
    </main>
  </body>
</html>
