<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FF6B6B" />
    <title>Qalc | インターネットにつながっていません</title>
    <link rel="icon" type="image/png" href="/Qalc/favicon.png" />
    <!--
      圏外のときに出る画面。「壊れた」と思わせないことが目的なので、
      アプリと同じ配色・同じ言いまわしにしてある。

      ここだけ CSS を直書きしているのは、この画面が出る状況では
      外部ファイルが取れないことがあるため（1枚で完結させる）。
      フォントも同じ理由でシステムのものを使う。Zen Maru Gothic が
      キャッシュにあれば使われ、無ければ普通の丸ゴシックに落ちる。
    -->
    <style>
      :root {
        --bg: #fffbf0;
        --panel: #ffffff;
        --text: #3f3f46;
        --primary: #FF6B6B;
        --accent: #fde68a;
      }
      * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100vh;   /* 古い端末むけのフォールバック */
        min-height: 100dvh;  /* 実際に使われる値 */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px))
                 calc(24px + env(safe-area-inset-right, 0px))
                 calc(24px + env(safe-area-inset-bottom, 0px))
                 calc(24px + env(safe-area-inset-left, 0px));
        background: var(--bg);
        color: var(--text);
        font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Kosugi Maru', system-ui, sans-serif;
        line-height: 1.8;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--panel);
        border: 4px solid var(--text);
        border-radius: 24px;
        box-shadow: 6px 6px 0 var(--text);
        padding: 28px 22px;
        text-align: center;
      }
      .mark { font-size: clamp(48px, 14vw, 76px); line-height: 1; margin-bottom: 8px; }
      h1 { font-size: clamp(20px, 5vw, 26px); font-weight: 900; margin: 0 0 12px; }
      p { font-size: clamp(14px, 3.6vw, 16px); margin: 0 0 22px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        width: 100%;
        padding: 0 20px;
        font-size: clamp(16px, 4vw, 18px);
        font-weight: 900;
        font-family: inherit;
        color: var(--panel);
        background: var(--primary);
        border: 3px solid var(--text);
        border-radius: 16px;
        box-shadow: 3px 3px 0 var(--text);
        cursor: pointer;
        touch-action: manipulation;
      }
      .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--text); }
      .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
      .hint {
        margin-top: 18px;
        font-size: clamp(12px, 3.2vw, 13px);
        opacity: 0.65;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
      @media (forced-colors: active) {
        .btn { border: 2px solid ButtonText; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">📡</div>
      <h1>いま インターネットに つながっていません</h1>
      <p>
        Wi-Fi が つながっているか たしかめてから、<br />
        下の ボタンを おしてね。
      </p>
      <!-- この画面だけは CSP の meta を入れていない。
           script-src 'self' にすると下のスクリプトが動かず、「もういちど ためす」が
           ただの飾りになるため。このページは外から受けとる値をひとつも表示しないので、
           差しこまれるものが無く、CSP を外しても危険が増えない。
           本体(index.html)の CSP はそのまま効いている。 -->
      <button class="btn" id="retry" type="button">もういちど ためす</button>
      <p class="hint">
        ホームがめんに Qalc を おいてあると、<br />
        つながっていなくても あそべます。
      </p>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.reload();
      });
      // つながり直したら、児童が押さなくても自動でもどる
      window.addEventListener('online', function () {
        location.replace('/Qalc/');
      });
    </script>
  </body>
</html>
